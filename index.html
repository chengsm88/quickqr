<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickQR - 專業 QR Code 生成器與設計工具</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
          },
          colors: {
            emeraldBrand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857'
            }
          }
        }
      }
    }
  </script>
  <style>
    @media print {
      body * { visibility: hidden !important; }
      #print-area, #print-area * { visibility: visible !important; }
      #print-area { position: absolute !important; left: 0 !important; top: 0 !important; width: 100% !important; margin: 0 !important; padding: 20px !important; background: white !important; }
      .no-print { display: none !important; }
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col antialiased selection:bg-emerald-500 selection:text-white">

  <!-- 頂部 Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white shadow-sm">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path>
          </svg>
        </div>
        <div>
          <span class="text-xl font-black bg-gradient-to-r from-emerald-600 to-teal-700 bg-clip-text text-transparent">QuickQR Studio</span>
          <span class="hidden sm:inline-block text-xs font-semibold px-2 py-0.5 ml-1.5 bg-emerald-50 text-emerald-700 rounded-full border border-emerald-200">專業二維碼設計</span>
        </div>
      </div>

      <nav class="flex items-center space-x-2">
        <button id="btn-show-history" class="px-3.5 py-1.5 text-xs font-semibold rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200 flex items-center space-x-1.5 transition">
          <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <span>歷史記錄</span>
          <span id="history-badge" class="ml-1 text-[10px] px-1.5 py-0.2 bg-emerald-100 text-emerald-800 rounded-full font-bold">0</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- 主工作台區塊 -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

      <!-- 左側 8 欄：類型選擇 + 步驟 1 + 步驟 2 -->
      <div class="lg:col-span-8 space-y-6">

        <!-- 頂部類型選擇面板 -->
        <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-xs">
          <div class="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-5 gap-2.5" id="type-selector-group">
            <button data-type="link" class="type-btn flex items-center justify-center space-x-1.5 py-2.5 px-3 rounded-xl border border-emerald-500 bg-emerald-50 text-emerald-700 font-semibold text-xs transition shadow-2xs">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
              <span>Link</span>
            </button>
            <button data-type="text" class="type-btn flex items-center justify-center space-x-1.5 py-2.5 px-3 rounded-xl border border-slate-200 bg-white text-slate-700 hover:border-slate-300 font-medium text-xs transition">
              <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path></svg>
              <span>Text</span>
            </button>
            <button data-type="email" class="type-btn flex items-center justify-center space-x-1.5 py-2.5 px-3 rounded-xl border border-slate-200 bg-white text-slate-700 hover:border-slate-300 font-medium text-xs transition">
              <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
              <span>E-mail</span>
            </button>
            <button data-type="call" class="type-btn flex items-center justify-center space-x-1.5 py-2.5 px-3 rounded-xl border border-slate-200 bg-white text-slate-700 hover:border-slate-300 font-medium text-xs transition">
              <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
              <span>Call</span>
            </button>
            <button data-type="sms" class="type-btn flex items-center justify-center space-x-1.5 py-2.5 px-3 rounded-xl border border-slate-200 bg-white text-slate-700 hover:border-slate-300 font-medium text-xs transition">
              <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
              <span>SMS</span>
            </button>
            <button data-type="vcard" class="type-btn flex items-center justify-center space-x-1.5 py-2.5 px-3 rounded-xl border border-slate-200 bg-white text-slate-700 hover:border-slate-300 font-medium text-xs transition">
              <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"></path></svg>
              <span>V-card</span>
            </button>
            <button data-type="whatsapp" class="type-btn flex items-center justify-center space-x-1.5 py-2.5 px-3 rounded-xl border border-slate-200 bg-white text-slate-700 hover:border-slate-300 font-medium text-xs transition">
              <svg class="w-4 h-4 text-emerald-600" fill="currentColor" viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.312.045-.694.074-2.125-.519-1.832-.759-3.007-2.63-3.099-2.75-.09-.123-.746-.991-.746-1.892 0-.9.472-1.343.64-1.527.168-.184.368-.231.491-.231.123 0 .246.002.353.007.112.006.262-.042.41.314.152.368.522 1.272.568 1.365.046.092.077.2.015.324-.061.123-.092.2-.184.307-.092.107-.194.24-.276.323-.092.092-.189.193-.082.377.108.184.478.789 1.026 1.277.706.63 1.302.825 1.486.917.185.092.292.077.4-.046.108-.123.461-.538.584-.722.123-.185.246-.154.415-.092.169.062 1.077.508 1.261.6.185.093.308.139.354.216.046.077.046.446-.098.851z"/></svg>
              <span>WhatsApp</span>
            </button>
            <button data-type="wifi" class="type-btn flex items-center justify-center space-x-1.5 py-2.5 px-3 rounded-xl border border-slate-200 bg-white text-slate-700 hover:border-slate-300 font-medium text-xs transition">
              <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.14 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"></path></svg>
              <span>Wi-Fi</span>
            </button>
            <button data-type="event" class="type-btn flex items-center justify-center space-x-1.5 py-2.5 px-3 rounded-xl border border-slate-200 bg-white text-slate-700 hover:border-slate-300 font-medium text-xs transition">
              <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
              <span>Event</span>
            </button>
            <button data-type="app" class="type-btn flex items-center justify-center space-x-1.5 py-2.5 px-3 rounded-xl border border-slate-200 bg-white text-slate-700 hover:border-slate-300 font-medium text-xs transition">
              <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
              <span>App</span>
            </button>
          </div>
        </div>

        <!-- 步驟 1: Complete the content -->
        <div class="bg-white rounded-2xl p-5 sm:p-6 border border-slate-200 shadow-xs space-y-4">
          <div class="flex items-center space-x-2.5 border-b border-slate-100 pb-3">
            <span class="w-6 h-6 rounded-md bg-slate-900 text-white text-xs font-black flex items-center justify-center">1</span>
            <h2 class="text-sm font-bold text-slate-800">Complete the content</h2>
          </div>

          <!-- 動態欄位區塊：Link 模式 -->
          <div id="content-fields-link" class="space-y-4 content-field-block">
            <div>
              <label for="input-link-url" class="block text-xs font-semibold text-slate-700 mb-1.5">Enter your Website <span class="text-rose-500">*</span></label>
              <div class="relative">
                <input type="url" id="input-link-url" placeholder="https://" class="w-full pl-3.5 pr-20 py-2.5 rounded-xl border border-slate-300 focus:outline-hidden focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600 text-sm">
                <div class="absolute right-1.5 top-1.5 flex items-center space-x-1">
                  <button id="btn-paste-link" type="button" class="px-2 py-1 text-xs text-slate-500 hover:text-emerald-700 hover:bg-emerald-50 rounded-lg">貼上</button>
                  <button id="btn-clear-link" type="button" class="px-2 py-1 text-xs text-slate-400 hover:text-slate-600 rounded-lg">清空</button>
                </div>
              </div>
            </div>
          </div>

          <!-- 動態欄位區塊：Text 模式 -->
          <div id="content-fields-text" class="hidden space-y-4 content-field-block">
            <div>
              <label for="input-text-val" class="block text-xs font-semibold text-slate-700 mb-1.5">Your Text</label>
              <textarea id="input-text-val" rows="3" placeholder="輸入純文字內容..." class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm focus:outline-hidden focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600"></textarea>
            </div>
          </div>

          <!-- 動態欄位區塊：Wi-Fi 模式 -->
          <div id="content-fields-wifi" class="hidden space-y-4 content-field-block">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label for="wifi-field-ssid" class="block text-xs font-semibold text-slate-700 mb-1">網絡名稱 (SSID) *</label>
                <input type="text" id="wifi-field-ssid" placeholder="例如：MyHome_5G" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm">
              </div>
              <div>
                <label for="wifi-field-pw" class="block text-xs font-semibold text-slate-700 mb-1">Wi-Fi 密碼</label>
                <input type="text" id="wifi-field-pw" placeholder="請輸入連線密碼" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm">
              </div>
            </div>
            <div class="flex items-center space-x-4 text-xs text-slate-600">
              <label class="flex items-center space-x-1 cursor-pointer">
                <input type="radio" name="wifi-sec" value="WPA" checked class="text-emerald-600">
                <span>WPA/WPA2/WPA3</span>
              </label>
              <label class="flex items-center space-x-1 cursor-pointer">
                <input type="radio" name="wifi-sec" value="WEP" class="text-emerald-600">
                <span>WEP</span>
              </label>
              <label class="flex items-center space-x-1 cursor-pointer">
                <input type="radio" name="wifi-sec" value="nopass" class="text-emerald-600">
                <span>無密碼 (開放)</span>
              </label>
            </div>
          </div>

          <!-- 動態欄位區塊：E-mail 模式 -->
          <div id="content-fields-email" class="hidden space-y-3 content-field-block">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label for="email-to" class="block text-xs font-semibold text-slate-700 mb-1">收件者 E-mail *</label>
                <input type="email" id="email-to" placeholder="name@example.com" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm">
              </div>
              <div>
                <label for="email-sub" class="block text-xs font-semibold text-slate-700 mb-1">郵件主旨</label>
                <input type="text" id="email-sub" placeholder="預設主旨" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm">
              </div>
            </div>
          </div>

          <!-- 通用單一輸入模式 (Call, SMS, WhatsApp 等) -->
          <div id="content-fields-generic" class="hidden space-y-3 content-field-block">
            <div>
              <label id="generic-label" for="generic-input" class="block text-xs font-semibold text-slate-700 mb-1.5">內容</label>
              <input type="text" id="generic-input" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm">
            </div>
          </div>

        </div>

        <!-- 步驟 2: Design your QR Code -->
        <div class="bg-white rounded-2xl p-5 sm:p-6 border border-slate-200 shadow-xs space-y-4">
          <div class="flex items-center space-x-2.5 border-b border-slate-100 pb-3">
            <span class="w-6 h-6 rounded-md bg-slate-900 text-white text-xs font-black flex items-center justify-center">2</span>
            <h2 class="text-sm font-bold text-slate-800">Design your QR Code</h2>
          </div>

          <!-- Design Tabs: Frame, Shape, Logo -->
          <div class="flex items-center border-b border-slate-200 space-x-6 text-sm font-semibold text-slate-500">
            <button id="tab-btn-frame" class="design-tab pb-2 text-emerald-600 border-b-2 border-emerald-600 flex items-center space-x-1.5">
              <span>Frame</span>
            </button>
            <button id="tab-btn-shape" class="design-tab pb-2 hover:text-slate-800 flex items-center space-x-1.5">
              <span>Shape &amp; Color</span>
            </button>
            <button id="tab-btn-logo" class="design-tab pb-2 hover:text-slate-800 flex items-center space-x-1.5">
              <span>Logo</span>
            </button>
          </div>

          <!-- 分頁內容：Frame 外框模板 -->
          <div id="design-panel-frame" class="pt-2">
            <p class="text-xs text-slate-500 mb-3">選擇精美外框樣式（即時預覽於右側）：</p>
            <div class="flex items-center space-x-3 overflow-x-auto py-2 custom-scrollbar" id="frame-picker-container">
              
              <!-- Frame 0: 無外框 -->
              <div data-frame="none" class="frame-item shrink-0 w-20 h-24 rounded-xl border-2 border-emerald-500 bg-emerald-50/40 p-2 flex flex-col items-center justify-center cursor-pointer transition">
                <div class="w-10 h-10 rounded-lg border border-slate-300 flex items-center justify-center text-slate-400 font-bold text-lg">✕</div>
                <span class="text-[10px] font-semibold text-slate-600 mt-2">None</span>
              </div>

              <!-- Frame 1: 經典底部 SCAN ME 橫幅框 -->
              <div data-frame="badge-bottom" class="frame-item shrink-0 w-20 h-24 rounded-xl border-2 border-slate-200 hover:border-slate-300 bg-white p-2 flex flex-col items-center justify-between cursor-pointer transition">
                <div class="w-11 h-11 border border-slate-300 rounded flex items-center justify-center bg-slate-50">
                  <div class="w-8 h-8 bg-slate-300 rounded-xs"></div>
                </div>
                <div class="w-full py-0.5 bg-slate-900 text-[8px] text-white text-center font-bold rounded-xs tracking-tighter">SCAN ME</div>
              </div>

              <!-- Frame 2: 頂部 SCAN ME 橫幅框 -->
              <div data-frame="badge-top" class="frame-item shrink-0 w-20 h-24 rounded-xl border-2 border-slate-200 hover:border-slate-300 bg-white p-2 flex flex-col items-center justify-between cursor-pointer transition">
                <div class="w-full py-0.5 bg-emerald-600 text-[8px] text-white text-center font-bold rounded-xs tracking-tighter">SCAN ME</div>
                <div class="w-11 h-11 border border-slate-300 rounded flex items-center justify-center bg-slate-50">
                  <div class="w-8 h-8 bg-slate-300 rounded-xs"></div>
                </div>
              </div>

              <!-- Frame 3: 簡約大圓角外框 -->
              <div data-frame="rounded-box" class="frame-item shrink-0 w-20 h-24 rounded-xl border-2 border-slate-200 hover:border-slate-300 bg-white p-2 flex flex-col items-center justify-center cursor-pointer transition">
                <div class="w-13 h-15 rounded-xl border-2 border-slate-800 p-1 flex flex-col items-center justify-center">
                  <div class="w-8 h-8 bg-slate-300 rounded-xs mb-1"></div>
                  <span class="text-[6px] font-bold text-slate-700">SCAN</span>
                </div>
              </div>

              <!-- Frame 4: 手機螢幕樣式 -->
              <div data-frame="phone" class="frame-item shrink-0 w-20 h-24 rounded-xl border-2 border-slate-200 hover:border-slate-300 bg-white p-2 flex flex-col items-center justify-center cursor-pointer transition">
                <div class="w-11 h-16 rounded-xl border-2 border-slate-800 p-1 flex flex-col items-center justify-between">
                  <div class="w-2.5 h-0.5 bg-slate-400 rounded-full"></div>
                  <div class="w-7 h-7 bg-slate-300 rounded-xs"></div>
                  <div class="w-1.5 h-1.5 rounded-full border border-slate-500"></div>
                </div>
              </div>

            </div>
          </div>

          <!-- 分頁內容：Shape & Color -->
          <div id="design-panel-shape" class="hidden pt-2 space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label for="color-dark" class="block text-xs font-semibold text-slate-700 mb-1">QR 前景色 (主色)</label>
                <div class="flex items-center space-x-2">
                  <input type="color" id="color-dark" value="#0f172a" class="w-8 h-8 rounded-lg border border-slate-300 cursor-pointer p-0.5">
                  <span id="color-dark-label" class="text-xs font-mono text-slate-600">#0f172a</span>
                </div>
              </div>
              <div>
                <label for="color-light" class="block text-xs font-semibold text-slate-700 mb-1">QR 背景色</label>
                <div class="flex items-center space-x-2">
                  <input type="color" id="color-light" value="#ffffff" class="w-8 h-8 rounded-lg border border-slate-300 cursor-pointer p-0.5">
                  <span id="color-light-label" class="text-xs font-mono text-slate-600">#ffffff</span>
                </div>
              </div>
            </div>
            <div>
              <label for="frame-text-custom" class="block text-xs font-semibold text-slate-700 mb-1">外框文字自訂 (預設為 SCAN ME)</label>
              <input type="text" id="frame-text-custom" value="SCAN ME" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-xs">
            </div>
          </div>

          <!-- 分頁內容：Logo -->
          <div id="design-panel-logo" class="hidden pt-2 space-y-3">
            <label class="block text-xs font-semibold text-slate-700">上傳中心圖示 (PNG / JPG / SVG)</label>
            <input type="file" id="logo-file-input" accept="image/*" class="w-full text-xs file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer">
            <div id="logo-preview-box" class="hidden items-center space-x-2 pt-1">
              <span class="text-xs text-slate-500">已加載 Logo</span>
              <button id="btn-remove-logo" type="button" class="text-xs text-rose-600 hover:underline">移除 Logo</button>
            </div>
          </div>

        </div>

      </div>

      <!-- 右側 4 欄：步驟 3 Download QR Code -->
      <div class="lg:col-span-4 space-y-4 lg:sticky lg:top-24">
        <div class="bg-white rounded-2xl p-5 sm:p-6 border border-slate-200 shadow-xs flex flex-col items-center text-center">
          
          <div class="flex items-center justify-between w-full mb-4 pb-2 border-b border-slate-100">
            <div class="flex items-center space-x-2">
              <span class="w-5 h-5 rounded-md bg-slate-900 text-white text-[11px] font-black flex items-center justify-center">3</span>
              <h3 class="text-sm font-bold text-slate-800">Download QR Code</h3>
            </div>
            <span class="px-2 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-full text-[10px] font-bold">即時渲染</span>
          </div>

          <!-- 畫布與二維碼容器 -->
          <div class="p-3 bg-slate-50 rounded-2xl border border-slate-100 shadow-inner flex items-center justify-center min-h-[290px] w-full">
            <div id="qr-render-wrapper" class="flex flex-col items-center justify-center">
              <canvas id="qr-main-canvas" width="280" height="280" class="rounded-xl shadow-xs"></canvas>
            </div>
          </div>

          <!-- 隱藏的 QRCode.js 生成節點 (供 Canvas 提取圖像用) -->
          <div id="raw-qrcode-buffer" class="hidden"></div>

          <!-- 下載按鈕 -->
          <div class="w-full space-y-2 mt-4">
            <button id="btn-download-final-qr" type="button" class="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-sm transition flex items-center justify-center space-x-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
              <span>Download QR Code</span>
            </button>
            <button id="btn-print-qr-card" type="button" class="w-full py-2 px-3 bg-white hover:bg-slate-50 text-slate-700 font-semibold border border-slate-200 rounded-xl text-xs transition flex items-center justify-center space-x-1">
              <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
              <span>列印連線桌牌小卡</span>
            </button>
          </div>

        </div>
      </div>

    </div>
  </main>

  <!-- 歷史記錄 Drawer / Modal -->
  <div id="modal-history" class="fixed inset-0 z-50 hidden bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-xl w-full p-6 shadow-2xl space-y-4 max-h-[85vh] flex flex-col">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 class="text-sm font-bold text-slate-800">生成歷史記錄 (僅存於本機)</h3>
        <button id="btn-close-history" class="text-slate-400 hover:text-slate-600 p-1">✕</button>
      </div>
      <div id="history-container-list" class="space-y-2 overflow-y-auto custom-scrollbar flex-grow pr-1"></div>
      <div class="pt-2 border-t border-slate-100 flex justify-between items-center">
        <button id="btn-clear-all-history" class="text-xs text-rose-600 font-medium hover:underline">清空本機記錄</button>
        <span class="text-[11px] text-slate-400">保障隱私・零資料上傳</span>
      </div>
    </div>
  </div>

  <!-- 浮動 Toast -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-16 opacity-0 transition-all duration-300 pointer-events-none flex items-center space-x-2 px-4 py-2.5 bg-slate-900 text-white rounded-xl shadow-lg text-xs">
    <span id="toast-text">通知訊息</span>
  </div>

  <script>
    const appState = {
      activeType: 'link',
      activeFrame: 'none',
      frameText: 'SCAN ME',
      colorDark: '#0f172a',
      colorLight: '#ffffff',
      logoImage: null,
      currentTextToEncode: 'https://',
      history: []
    };

    const canvas = document.getElementById('qr-main-canvas');
    const ctx = canvas.getContext('2d');
    const rawQrContainer = document.getElementById('raw-qrcode-buffer');

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const text = document.getElementById('toast-text');
      text.textContent = msg;
      toast.classList.remove('translate-y-16', 'opacity-0');
      setTimeout(() => toast.classList.add('translate-y-16', 'opacity-0'), 2500);
    }

    // 類型標籤點擊切換
    document.querySelectorAll('.type-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.type-btn').forEach(b => {
          b.classList.remove('border-emerald-500', 'bg-emerald-50', 'text-emerald-700', 'font-semibold');
          b.classList.add('border-slate-200', 'bg-white', 'text-slate-700', 'font-medium');
        });
        btn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700', 'font-semibold');
        btn.classList.remove('border-slate-200', 'bg-white', 'text-slate-700', 'font-medium');

        appState.activeType = btn.dataset.type;
        switchContentField(appState.activeType);
        triggerRebuildQR();
      });
    });

    function switchContentField(type) {
      document.querySelectorAll('.content-field-block').forEach(b => b.classList.add('hidden'));
      if (type === 'link') {
        document.getElementById('content-fields-link').classList.remove('hidden');
      } else if (type === 'text') {
        document.getElementById('content-fields-text').classList.remove('hidden');
      } else if (type === 'wifi') {
        document.getElementById('content-fields-wifi').classList.remove('hidden');
      } else if (type === 'email') {
        document.getElementById('content-fields-email').classList.remove('hidden');
      } else {
        const genBlock = document.getElementById('content-fields-generic');
        const genLabel = document.getElementById('generic-label');
        const genInput = document.getElementById('generic-input');
        genBlock.classList.remove('hidden');
        genLabel.textContent = `輸入 ${type.toUpperCase()} 內容`;
        genInput.placeholder = type === 'call' ? '例如：+852 9876 5432' : (type === 'whatsapp' ? '輸入電話號碼' : '請輸入相應內容');
      }
    }

    // 外框模板切換
    document.querySelectorAll('.frame-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.frame-item').forEach(f => {
          f.classList.remove('border-emerald-500', 'bg-emerald-50/40');
          f.classList.add('border-slate-200', 'bg-white');
        });
        item.classList.add('border-emerald-500', 'bg-emerald-50/40');
        item.classList.remove('border-slate-200', 'bg-white');

        appState.activeFrame = item.dataset.frame;
        renderCanvasQR();
      });
    });

    // 設計子選單切換 (Frame / Shape / Logo)
    const tabs = [
      { btn: document.getElementById('tab-btn-frame'), pnl: document.getElementById('design-panel-frame') },
      { btn: document.getElementById('tab-btn-shape'), pnl: document.getElementById('design-panel-shape') },
      { btn: document.getElementById('tab-btn-logo'), pnl: document.getElementById('design-panel-logo') }
    ];

    tabs.forEach(t => {
      t.btn.addEventListener('click', () => {
        tabs.forEach(x => {
          x.btn.classList.remove('text-emerald-600', 'border-b-2', 'border-emerald-600');
          x.btn.classList.add('hover:text-slate-800');
          x.pnl.classList.add('hidden');
        });
        t.btn.classList.add('text-emerald-600', 'border-b-2', 'border-emerald-600');
        t.btn.classList.remove('hover:text-slate-800');
        t.pnl.classList.remove('hidden');
      });
    });

    // 顏色與設定監聽
    document.getElementById('color-dark').addEventListener('input', (e) => {
      appState.colorDark = e.target.value;
      document.getElementById('color-dark-label').textContent = e.target.value;
      triggerRebuildQR();
    });
    document.getElementById('color-light').addEventListener('input', (e) => {
      appState.colorLight = e.target.value;
      document.getElementById('color-light-label').textContent = e.target.value;
      triggerRebuildQR();
    });
    document.getElementById('frame-text-custom').addEventListener('input', (e) => {
      appState.frameText = e.target.value || 'SCAN ME';
      renderCanvasQR();
    });

    // Logo 上傳與移除
    document.getElementById('logo-file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          appState.logoImage = img;
          document.getElementById('logo-preview-box').classList.remove('hidden');
          renderCanvasQR();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('btn-remove-logo').addEventListener('click', () => {
      appState.logoImage = null;
      document.getElementById('logo-file-input').value = '';
      document.getElementById('logo-preview-box').classList.add('hidden');
      renderCanvasQR();
    });

    // 內容變更觸發
    ['input-link-url', 'input-text-val', 'wifi-field-ssid', 'wifi-field-pw', 'email-to', 'email-sub', 'generic-input'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('input', () => triggerRebuildQR());
    });
    document.querySelectorAll('input[name="wifi-sec"]').forEach(r => r.addEventListener('change', () => triggerRebuildQR()));

    function computeStringToEncode() {
      const type = appState.activeType;
      if (type === 'link') {
        const val = document.getElementById('input-link-url').value.trim();
        return val ? (/^https?:\/\//i.test(val) ? val : 'https://' + val) : 'https://';
      }
      if (type === 'text') {
        return document.getElementById('input-text-val').value.trim() || 'QuickQR';
      }
      if (type === 'wifi') {
        const ssid = document.getElementById('wifi-field-ssid').value.trim() || 'WiFi_Guest';
        const pw = document.getElementById('wifi-field-pw').value;
        const auth = document.querySelector('input[name="wifi-sec"]:checked').value;
        return `WIFI:S:${ssid};T:${auth};${auth !== 'nopass' ? 'P:' + pw + ';' : ''};`;
      }
      if (type === 'email') {
        const to = document.getElementById('email-to').value.trim();
        const sub = document.getElementById('email-sub').value.trim();
        return `mailto:${to}?subject=${encodeURIComponent(sub)}`;
      }
      if (type === 'call') {
        return `tel:${document.getElementById('generic-input').value.trim()}`;
      }
      if (type === 'sms') {
        return `sms:${document.getElementById('generic-input').value.trim()}`;
      }
      if (type === 'whatsapp') {
        const num = document.getElementById('generic-input').value.trim().replace(/[^0-9]/g, '');
        return `https://wa.me/${num}`;
      }
      return document.getElementById('generic-input').value.trim() || 'QuickQR Studio';
    }

    let rebuildTimer = null;
    function triggerRebuildQR() {
      clearTimeout(rebuildTimer);
      rebuildTimer = setTimeout(() => {
        let text = computeStringToEncode();
        appState.currentTextToEncode = text;
        buildRawQRCode(text);
      }, 250);
    }

    function buildRawQRCode(text) {
      rawQrContainer.innerHTML = '';
      new QRCode(rawQrContainer, {
        text: text,
        width: 200,
        height: 200,
        colorDark: appState.colorDark,
        colorLight: appState.colorLight,
        correctLevel: QRCode.CorrectLevel.H
      });

      setTimeout(() => renderCanvasQR(), 50);
    }

    // 將底層 QRCode 渲染並結合所選 Frame 繪製到主 Canvas
    function renderCanvasQR() {
      const qrCanvas = rawQrContainer.querySelector('canvas');
      if (!qrCanvas) return;

      const frame = appState.activeFrame;
      canvas.width = 280;
      canvas.height = 280;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (frame === 'none') {
        ctx.fillStyle = appState.colorLight;
        ctx.fillRect(0, 0, 280, 280);
        ctx.drawImage(qrCanvas, 30, 30, 220, 220);
      } else if (frame === 'badge-bottom') {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 280, 280);
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 3;
        ctx.strokeRect(15, 15, 250, 250);
        ctx.drawImage(qrCanvas, 40, 25, 200, 200);

        ctx.fillStyle = '#0f172a';
        ctx.fillRect(35, 230, 210, 34);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 14px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(appState.frameText, 140, 252);
      } else if (frame === 'badge-top') {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 280, 280);
        ctx.strokeStyle = '#059669';
        ctx.lineWidth = 3;
        ctx.strokeRect(15, 15, 250, 250);

        ctx.fillStyle = '#059669';
        ctx.fillRect(35, 16, 210, 32);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 14px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(appState.frameText, 140, 38);

        ctx.drawImage(qrCanvas, 40, 56, 200, 200);
      } else if (frame === 'rounded-box') {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(10, 10, 260, 260, 24);
        else ctx.rect(10, 10, 260, 260);
        ctx.fill();
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.drawImage(qrCanvas, 40, 25, 200, 200);
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 13px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(appState.frameText, 140, 248);
      } else if (frame === 'phone') {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(30, 5, 220, 270, 28);
        else ctx.rect(30, 5, 220, 270);
        ctx.fill();
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.fillStyle = '#94a3b8';
        ctx.beginPath();
        ctx.arc(140, 20, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.drawImage(qrCanvas, 45, 35, 190, 190);

        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(140, 250, 10, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 繪製中央 Logo
      if (appState.logoImage) {
        const logoSize = 48;
        const lx = (280 - logoSize) / 2;
        const ly = frame === 'badge-top' ? 132 : (frame === 'badge-bottom' ? 105 : 116);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(lx - 4, ly - 4, logoSize + 8, logoSize + 8);
        ctx.drawImage(appState.logoImage, lx, ly, logoSize, logoSize);
      }
    }

    // 下載按鈕處理
    document.getElementById('btn-download-final-qr').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `QuickQR_${appState.activeType}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      showToast('QR Code 已開始下載！');

      saveHistoryItem({
        type: appState.activeType,
        text: appState.currentTextToEncode,
        time: Date.now()
      });
    });

    // 貼上與清空
    document.getElementById('btn-paste-link').addEventListener('click', async () => {
      try {
        const txt = await navigator.clipboard.readText();
        if (txt) { document.getElementById('input-link-url').value = txt; triggerRebuildQR(); showToast('已貼上網址'); }
      } catch (e) { showToast('無法讀取剪貼簿，請手動貼上'); }
    });
    document.getElementById('btn-clear-link').addEventListener('click', () => {
      document.getElementById('input-link-url').value = '';
      triggerRebuildQR();
    });

    // 歷史記錄儲存與面板控制
    function loadHistory() {
      try {
        const str = localStorage.getItem('quickqr_studio_history');
        if (str) appState.history = JSON.parse(str);
      } catch (e) { appState.history = []; }
      updateHistoryBadge();
    }

    function saveHistoryItem(item) {
      appState.history.unshift(item);
      if (appState.history.length > 30) appState.history.pop();
      try { localStorage.setItem('quickqr_studio_history', JSON.stringify(appState.history)); } catch (e) {}
      updateHistoryBadge();
    }

    function updateHistoryBadge() {
      document.getElementById('history-badge').textContent = appState.history.length;
    }

    function renderHistoryList() {
      const list = document.getElementById('history-container-list');
      list.innerHTML = '';
      if (appState.history.length === 0) {
        list.innerHTML = '<p class="text-xs text-slate-400 py-6 text-center">尚無生成記錄</p>';
        return;
      }
      appState.history.forEach((h, idx) => {
        const div = document.createElement('div');
        div.className = 'p-3 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-between text-xs';
        div.innerHTML = `
          <div class="truncate mr-3">
            <span class="font-bold uppercase text-emerald-700 bg-emerald-100 px-1.5 py-0.5 rounded-xs mr-1 text-[10px]">${h.type}</span>
            <span class="text-slate-700 font-mono">${h.text}</span>
            <span class="block text-[10px] text-slate-400 mt-0.5">${new Date(h.time).toLocaleString()}</span>
          </div>
          <button data-idx="${idx}" class="btn-copy-history text-slate-500 hover:text-emerald-700 font-semibold shrink-0">複製</button>
        `;
        list.appendChild(div);
      });

      list.querySelectorAll('.btn-copy-history').forEach(b => {
        b.addEventListener('click', (e) => {
          const item = appState.history[parseInt(e.target.dataset.idx, 10)];
          navigator.clipboard.writeText(item.text).then(() => showToast('已複製！'));
        });
      });
    }

    document.getElementById('btn-show-history').addEventListener('click', () => {
      renderHistoryList();
      document.getElementById('modal-history').classList.remove('hidden');
    });
    document.getElementById('btn-close-history').addEventListener('click', () => {
      document.getElementById('modal-history').classList.add('hidden');
    });
    document.getElementById('btn-clear-all-history').addEventListener('click', () => {
      appState.history = [];
      localStorage.removeItem('quickqr_studio_history');
      updateHistoryBadge();
      renderHistoryList();
      showToast('已清空歷史記錄');
    });

    document.getElementById('btn-print-qr-card').addEventListener('click', () => window.print());

    // 初始化啟動
    loadHistory();
    triggerRebuildQR();
  </script>
</body>
</html>
